image:
  registry: registry.example.com
  repository: example
  tag: "1.0.0"

commonLabels:
  app: example

ports:
  - name: http
    containerPort: 8000
    protocol: TCP

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http

service:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http

ingress:
  enabled: true
  ingressClassName: traefik
  hostname: example.local
  tls: true
  existingSecret: example-tls

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPU: 75
  targetMemory: 0

pdb:
  enabled: true

nodeAffinityPreset:
  type: hard
  key: on-demand
  values: ["true"]

envVarsConfigMap:
  - shared-config
  - other-config

envVars:
  LOG_LEVEL: info

podReplicaAlarm:
  enabled: true
  datasourceUid: example-uid

sealedSecret:
  encryptedData:
    API_KEY: sealed-value
