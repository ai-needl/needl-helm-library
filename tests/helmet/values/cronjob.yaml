image:
  registry: registry.example.com
  repository: example
  tag: "1.0.0"

ports:
  - name: http
    containerPort: 8000
    protocol: TCP

ingress:
  enabled: true
  hostname: example.local
  tls: true
  selfSigned: true

cronjob:
  enabled: true
  schedule: "0 * * * *"
  containers:
    - name: task
      image: registry.example.com/example:1.0.0
      args: ["run"]
