{{- define "helmet.sealedsecret" -}}
{{- if .Values.sealedSecret.encryptedData }}
{{- /* Name and namespace must match what the values were sealed for (kubeseal's default strict scope) */}}
{{- $name := default (include "common.names.fullname" .) .Values.sealedSecret.name }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $name }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
spec:
  encryptedData: {{- toYaml .Values.sealedSecret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ $name }}
      namespace: {{ include "common.names.namespace" . | quote }}
    type: {{ .Values.sealedSecret.type }}
{{- end }}
{{- end -}}
