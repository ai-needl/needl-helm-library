{{- define "helmet.podSpec" -}}
{{- $podLabels := include "common.tplvalues.merge" (dict "values" (list .Values.podLabels .Values.commonLabels) "context" .) | fromYaml }}
{{- if .Values.initContainers }}
initContainers: {{- include "common.tplvalues.render" (dict "value" .Values.initContainers "context" $) | nindent 2 }}
{{- end }}
containers:
  - name: {{ .Chart.Name }}
    {{- if .Values.containerSecurityContext.enabled }}
    securityContext: {{- include "helmet.securityContext" .Values.containerSecurityContext | nindent 6 }}
    {{- end }}
    image: {{ include "common.images.image" (dict "imageRoot" .Values.image "global" .Values.global) }}
    imagePullPolicy: {{ default (eq .Values.image.tag "latest" | ternary "Always" "IfNotPresent") .Values.image.pullPolicy }}
    {{- if .Values.command }}
    command: {{- include "common.tplvalues.render" (dict "value" .Values.command "context" $) | nindent 6 }}
    {{- end }}
    {{- if .Values.args }}
    args: {{- include "common.tplvalues.render" (dict "value" .Values.args "context" $) | nindent 6 }}
    {{- end }}
    {{- if .Values.envVars }}
    env: {{- include "helmet.toEnvArray" (dict "envVars" .Values.envVars "context" $) | indent 6 }}
    {{- end }}
    {{- if or .Values.envVarsConfigMap .Values.envVarsSecret .Values.sealedSecret.encryptedData }}
    envFrom:
      {{- range (kindIs "slice" .Values.envVarsConfigMap | ternary .Values.envVarsConfigMap (list .Values.envVarsConfigMap)) | compact }}
      - configMapRef:
          name: {{ include "common.tplvalues.render" (dict "value" . "context" $) }}
      {{- end }}
      {{- range (kindIs "slice" .Values.envVarsSecret | ternary .Values.envVarsSecret (list .Values.envVarsSecret)) | compact }}
      - secretRef:
          name: {{ include "common.tplvalues.render" (dict "value" . "context" $) }}
      {{- end }}
      {{- if .Values.sealedSecret.encryptedData }}
      - secretRef:
          name: {{ include "helmet.sealedSecretName" . }}
      {{- end }}
    {{- end }}
    {{- if .Values.ports }}
    ports: {{- include "common.tplvalues.render" (dict "value" .Values.ports "context" $) | nindent 6 }}
    {{- end }}
    {{- if and .Values.livenessProbe.enabled (omit .Values.livenessProbe "enabled") }}
    livenessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.livenessProbe "enabled") "context" $) | nindent 6 }}
    {{- end }}
    {{- if and .Values.readinessProbe.enabled (omit .Values.readinessProbe "enabled") }}
    readinessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.readinessProbe "enabled") "context" $) | nindent 6 }}
    {{- end }}
    {{- if and .Values.startupProbe.enabled (omit .Values.startupProbe "enabled") }}
    startupProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.startupProbe "enabled") "context" $) | nindent 6 }}
    {{- end }}
    {{- if .Values.lifecycleHooks }}
    lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 6 }}
    {{- end }}
    {{- if .Values.resources }}
    resources: {{- toYaml .Values.resources | nindent 6 }}
    {{- end }}
    {{- if or .Values.configMap.mounted .Values.extraVolumeMounts .Values.persistence.enabled }}
    volumeMounts:
      {{- if .Values.configMap.mounted }}
      - name: {{ include "common.names.fullname" . }}
        mountPath: {{ .Values.configMap.mountPath }}
        {{- if .Values.configMap.subPath }}
        subPath: {{ .Values.configMap.subPath }}
        {{- end }}
      {{- end }}
      {{- if .Values.persistence.enabled }}
      - name: data
        mountPath: {{ .Values.persistence.mountPath }}
        {{- if .Values.persistence.subPath }}
        subPath: {{ .Values.persistence.subPath }}
        {{- end }}
      {{- end }}
      {{- if .Values.extraVolumeMounts }}
      {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 6 }}
      {{- end }}
    {{- end }}
  {{- if .Values.sidecars }}
  {{- include "common.tplvalues.render" (dict "value" .Values.sidecars "context" $) | nindent 2 }}
  {{- end }}
{{- if or .Values.configMap.mounted .Values.extraVolumes .Values.persistence.enabled }}
volumes:
  {{- if .Values.configMap.mounted }}
  - name: {{ include "common.names.fullname" . }}
    configMap:
      name: {{ include "common.names.fullname" . }}
  {{- end }}
  {{- if .Values.persistence.enabled }}
  - name: data
    persistentVolumeClaim:
      claimName: {{ default (include "common.names.fullname" .) .Values.persistence.existingClaim }}
  {{- end }}
  {{- if .Values.extraVolumes }}
  {{- include "common.tplvalues.render" ( dict "value" .Values.extraVolumes "context" $) | nindent 2 }}
  {{- end }}
{{- end }}
{{- include "common.images.renderPullSecrets" (dict "images" (list .Values.image) "context" $) | nindent 0 }}
{{- if .Values.hostAliases }}
hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 2 }}
{{- end }}
{{- if .Values.affinity }}
affinity: {{- include "common.tplvalues.render" ( dict "value" .Values.affinity "context" $) | nindent 2 }}
{{- else if or .Values.podAffinityPreset .Values.podAntiAffinityPreset .Values.nodeAffinityPreset.type }}
affinity:
  {{- if not (empty .Values.podAffinityPreset) }}
  podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAffinityPreset "customLabels" $podLabels "context" $) | nindent 4 }}
  {{- end }}
  {{- if not (empty .Values.podAntiAffinityPreset) }}
  podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAntiAffinityPreset "customLabels" $podLabels "context" $) | nindent 4 }}
  {{- end }}
  {{- if not (empty .Values.nodeAffinityPreset.type) }}
  nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.nodeAffinityPreset.type "key" .Values.nodeAffinityPreset.key "values" .Values.nodeAffinityPreset.values) | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.nodeSelector }}
nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.nodeSelector "context" $) | nindent 2 }}
{{- end }}
{{- if .Values.tolerations }}
tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.tolerations "context" $) | nindent 2 }}
{{- end }}
{{- if .Values.priorityClassName }}
priorityClassName: {{ .Values.priorityClassName | quote }}
{{- end }}
{{- if .Values.topologySpreadConstraints }}
topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" .Values.topologySpreadConstraints "context" $) | nindent 2 }}
{{- end }}
{{- if .Values.schedulerName }}
schedulerName: {{ .Values.schedulerName | quote }}
{{- end }}
{{- if .Values.podSecurityContext.enabled }}
securityContext: {{- include "helmet.securityContext" .Values.podSecurityContext | nindent 2 }}
{{- end }}
{{- if .Values.terminationGracePeriodSeconds }}
terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
{{- end }}
serviceAccountName: {{ include "helmet.serviceAccountName" . }}
{{- end -}}
