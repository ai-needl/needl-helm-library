name: Charts CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  # Manual publish from main (e.g. the first release, or re-publishing after a
  # failed run). Skips the "did the chart change?" check.
  workflow_dispatch:

env:
  HELM_VERSION: v3.19.0
  CHART_DIR: charts/helmet

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      # The only dependency (bitnami/common) is pulled straight from the OCI
      # registry declared in Chart.yaml, so no `helm repo add` is needed.
      - name: Helm Build Dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Helm lint
        run: helm lint "$CHART_DIR"

  release-stage:
    name: Release to Stage ECR
    needs: check
    # Only merges (pushes) to main, or a manual run on main, publish;
    # feature branches and PRs stop at Check.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # From the "stage" GitHub environment: AWS_ACCOUNT_ID, AWS_REGION and
    # ECR_NAMESPACE variables, and the ECR_PUBLISH_ROLE_ARN secret.
    environment: stage
    permissions:
      id-token: write   # OIDC federation to AWS
      contents: write   # push the <chart>-<version> git tag
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      # Charts are pushed to <namespace>/<chart name>, i.e. helm-library/helmet.
      ECR_NAMESPACE: ${{ vars.ECR_NAMESPACE || 'helm-library' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Merges that don't touch the chart (README, workflow, examples, ...)
      # have nothing new to publish, so the remaining steps are skipped.
      - name: Detect chart changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run, releasing."
            echo "chart=true" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$CHART_DIR" ":(exclude)$CHART_DIR/examples"; then
            echo "No changes under $CHART_DIR in this merge, nothing to release."
            echo "chart=false" >> "$GITHUB_OUTPUT"
          else
            echo "chart=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Helm
        if: steps.changes.outputs.chart == 'true'
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure AWS credentials
        if: steps.changes.outputs.chart == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Stage ECR
        if: steps.changes.outputs.chart == 'true'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Package and push chart
        if: steps.changes.outputs.chart == 'true'
        run: |
          set -euo pipefail
          name=$(yq -r '.name' "$CHART_DIR/Chart.yaml")
          version=$(yq -r '.version' "$CHART_DIR/Chart.yaml")
          repo="$ECR_NAMESPACE/$name"

          # Published versions are immutable. A chart change merged without a
          # version bump fails here instead of being silently skipped.
          if aws ecr describe-images --repository-name "$repo" \
               --image-ids imageTag="$version" >/dev/null 2>&1; then
            echo "::error file=$CHART_DIR/Chart.yaml::$repo:$version already exists in Stage ECR. Bump 'version' in Chart.yaml to publish this change."
            exit 1
          fi

          helm dependency build "$CHART_DIR"
          helm package "$CHART_DIR" --destination dist
          helm push "dist/$name-$version.tgz" "oci://$ECR_REGISTRY/$ECR_NAMESPACE"

          git tag "$name-$version" "$GITHUB_SHA"
          git push origin "$name-$version"

          {
            echo "### Published \`$name\` $version to Stage ECR"
            echo '```yaml'
            echo "dependencies:"
            echo "  - name: $name"
            echo "    version: \"$version\""
            echo "    repository: oci://$ECR_REGISTRY/$ECR_NAMESPACE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
